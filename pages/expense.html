<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Management</title>
    <link rel="stylesheet" href="../css/expense.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="page-container">

    <div class="page-header">
        <h1>💸 Expense Management</h1>
        <a href="../dashboard.html" class="back-btn">← Dashboard</a>
    </div>

    <section class="form-card">
        <form id="expenseForm" novalidate>
            <div class="form-group">
                <label for="expenseTitle">Expense Title</label>
                <input type="text" id="expenseTitle" placeholder="Groceries" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="expenseCategory">Category</label>
                <select id="expenseCategory">
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Fuel">Fuel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Electricity">Electricity</option>
                    <option value="Water Bill">Water Bill</option>
                    <option value="Mobile Recharge">Mobile Recharge</option>
                    <option value="Internet">Internet</option>
                    <option value="Medical">Medical</option>
                    <option value="Travel">Travel</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="expenseAmount">Amount</label>
                <input type="number" id="expenseAmount" placeholder="1000" min="0" step="0.01">
            </div>

            <div class="form-group">
                <label for="expenseDate">Date</label>
                <input type="date" id="expenseDate">
            </div>

            <div class="form-group">
                <label for="expensePaymentMethod">Payment Method</label>
                <select id="expensePaymentMethod">
                    <option value="">Select Payment Method</option>
                    <option value="Cash">Cash</option>
                    <option value="Card">Card</option>
                    <option value="UPI">UPI</option>
                    <option value="Net Banking">Net Banking</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="expenseNotes">Notes</label>
                <textarea id="expenseNotes" rows="4" placeholder="Optional"></textarea>
            </div>

            <div id="expenseMessage" class="message-box" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></div>

            <button type="submit" id="saveExpenseBtn">
                <i class="fa-solid fa-floppy-disk"></i> Save Expense
            </button>
        </form>
    </section>

    <section class="summary-card">
        <div class="summary-item">
            <span>Total Expense</span>
            <strong id="expenseTotal">₹0.00</strong>
        </div>
        <div class="summary-item">
            <span>Total Entries</span>
            <strong id="expenseCount">0</strong>
        </div>
    </section>

    <section class="history-card">
        <div class="history-toolbar">
            <input type="search" id="expenseSearch" aria-label="Search expense history" placeholder="Search expense history..." autocomplete="off">
            <select id="expenseFilterCategory" aria-label="Filter expenses by category">
                <option value="">All Categories</option>
                <option value="Food">Food</option>
                <option value="Fuel">Fuel</option>
                <option value="Shopping">Shopping</option>
                <option value="Electricity">Electricity</option>
                <option value="Water Bill">Water Bill</option>
                <option value="Mobile Recharge">Mobile Recharge</option>
                <option value="Internet">Internet</option>
                <option value="Medical">Medical</option>
                <option value="Travel">Travel</option>
                <option value="Rent">Rent</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
            <select id="expenseFilterPayment" aria-label="Filter expenses by payment method">
                <option value="">All Payment Methods</option>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="UPI">UPI</option>
                <option value="Net Banking">Net Banking</option>
                <option value="Other">Other</option>
            </select>
            <select id="expenseSort" aria-label="Sort expenses">
                <option value="date_desc">Date: Newest</option>
                <option value="date_asc">Date: Oldest</option>
                <option value="amount_desc">Amount: High to Low</option>
                <option value="amount_asc">Amount: Low to High</option>
                <option value="title_asc">Title: A → Z</option>
                <option value="title_desc">Title: Z → A</option>
            </select>
        </div>

        <div class='table-responsive'>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Payment</th>
                    <th>Notes</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
        </table>
        </div>
    </section>

</div>

<script src="../js/engine/storage.js"></script>
<script src="../js/engine/finance.js"></script>
<script src="../js/services/expense.service.js"></script>
<script src="../js/modules/expense/expense.storage.js"></script>
<script src="../js/modules/expense/expense.engine.js"></script>
<script src="../js/modules/expense/expense.controller.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (typeof ExpenseController !== "undefined" && typeof ExpenseController.initialize === "function") {
            ExpenseController.initialize();
        }
    });
</script>
<script src="../js/app.js"></script>

</body>

</html>
