<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SFM PRO | Loans</title>

<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/module.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body data-page="loans">

<div class="page-container">

<div class="page-header">

<h1>

<i class="fa-solid fa-building-columns"></i>

Loans Management

</h1>

<button onclick="location.href='../dashboard.html'">

← Dashboard

</button>

</div>

<!-- =============================== -->
<!-- Loan Form -->
<!-- =============================== -->

<form id="loanForm">

<div class="form-card">

<label>Loan Name</label>

<input
type="text"
id="loanName"
aria-label="Loan name"
placeholder="Personal Loan"
required>

<label>Bank Name</label>

<input
type="text"
id="bankName"
aria-label="Bank name"
placeholder="Axis Bank"
required>

<label>Loan Amount</label>

<input
type="number"
id="loanAmount"
aria-label="Loan amount"
required>

<label>Interest Rate (%)</label>

<input
type="number"
step="0.01"
id="loanInterest"
aria-label="Loan interest rate"
required>

<label>Tenure (Months)</label>

<input
type="number"
id="loanTenure"
aria-label="Loan tenure in months"
required>

<label>Start Date</label>

<input
type="date"
id="loanDate"
aria-label="Loan start date"
required>

<button
type="button"
id="saveLoanBtn">

<i class="fa-solid fa-floppy-disk"></i>

Save Loan

</button>

</div>

</form>

<!-- =============================== -->
<!-- Loan Summary -->
<!-- =============================== -->

<div class="history-card">

<h2>

Loan Summary

</h2>

<div class="summary-grid">

<div>

<h4>Total Loans</h4>

<h2 id="loanCount">

0

</h2>

</div>

<div>

<h4>Total Outstanding</h4>

<h2 id="loanOutstanding">

₹0

</h2>

</div>

<div>

<h4>Total EMI</h4>

<h2 id="loanEMI">

₹0

</h2>

</div>

</div>

</div>

<!-- =============================== -->
<!-- Loan Table -->
<!-- =============================== -->

<div class="history-card">

<h2>

Loan History

</h2>

<div class='table-responsive'>
<table>

<thead>

<tr>

<th>Loan</th>

<th>Bank</th>

<th>Amount</th>

<th>EMI</th>

<th>Outstanding</th>

<th>Action</th>

</tr>

</thead>

<tbody id="loanTable">

<tr>

<td colspan="6">

No Loans Found

</td>

</tr>

</tbody>

</table>
</div>

</div>

</div>

<!-- =============================== -->
<!-- JavaScript -->
<!-- =============================== -->

<!-- Shared Engine -->
<script src="../js/engine/storage.js"></script>
<script src="../js/engine/finance.js"></script>

<!-- Loan Enterprise Module -->
<script src="../js/modules/loans/loan.storage.js"></script>
<script src="../js/modules/loans/loan.engine.js"></script>
<script src="../js/services/loan.service.js"></script>
<script src="../js/modules/loans/loan.controller.js"></script>

</body>
</html>
