<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Management | SFM PRO</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"><link rel="stylesheet" href="../css/enterprise-tools.css"><script type="module" src="../js/modules/shared/protected-page.js"></script></head><body><main class="et-shell"><header class="et-top"><div class="et-brand"><i class="fa-solid fa-building-shield"></i><div><h1>Asset Management</h1><p>Register, value and protect owned assets</p></div></div><nav class="et-nav"><a href="../dashboard.html">Dashboard</a><a href="reports.html">Reports</a></nav></header><section class="et-grid"><article class="card metric"><span class="muted">Registered Assets</span><strong id="assetCount">0</strong></article><article class="card metric"><span class="muted">Current Value</span><strong id="assetCurrentValue">₹0</strong></article><article class="card metric"><span class="muted">Market Value</span><strong id="assetMarketValue">₹0</strong></article><article class="card metric"><span class="muted">Depreciation</span><strong id="assetDepreciation">₹0</strong></article><article class="card panel-5"><h2>Add Asset</h2><form id="assetForm"><div class="form-grid"><label>Name<input name="name" required maxlength="100"></label><label>Category<select name="category" required><option value="">Select</option><option>Property</option><option>Vehicle</option><option>Electronics</option><option>Jewellery</option><option>Furniture</option><option>Equipment</option><option>Other</option></select></label><label>Purchase date<input type="date" name="purchaseDate"></label><label>Purchase value<input type="number" name="purchaseValue" min="0.01" step="0.01" required></label><label>Current value<input type="number" name="currentValue" min="0" step="0.01"></label><label>Market value<input type="number" name="marketValue" min="0" step="0.01"></label><label>Location<input name="location" maxlength="160"></label><label>Warranty until<input type="date" name="warrantyUntil"></label><label>AMC until<input type="date" name="amcUntil"></label><label>Insurance until<input type="date" name="insuranceUntil"></label><label>Invoice<input id="assetInvoice" type="file" accept="image/*,.pdf"></label><label>Photo<input id="assetPhoto" type="file" accept="image/*"></label><label class="wide">Notes<textarea name="notes" maxlength="500"></textarea></label></div><p id="assetMessage" class="muted" role="status"></p><div class="actions"><button class="btn btn-primary" type="submit">Save Asset</button></div></form></article><article class="card panel-7"><h2>Asset Register</h2><div class="toolbar"><input id="assetSearch" type="search" placeholder="Search assets, category or location"></div><div class="table-wrap"><table><thead><tr><th>Asset</th><th>Category</th><th>Purchase</th><th>Current</th><th>Location</th><th>Warranty</th><th>Action</th></tr></thead><tbody id="assetTableBody"></tbody></table></div></article></section></main><script type="module" src="../js/modules/assets/asset.controller.js"></script></body></html>
